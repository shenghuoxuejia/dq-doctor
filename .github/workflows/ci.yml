name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # 没有这一步，matrix 里的 python-version 只是摆设：
      # 三个 job 会全部用 runner 自带的默认 Python 跑。
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project (no API key required)
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Smoke test — CLI import without DEEPSEEK_API_KEY
        env:
          DEEPSEEK_API_KEY: ""
        run: python -c "import dq_doctor.graph, dq_doctor.nodes; print('import ok')"
