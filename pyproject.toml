[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-doctor"
version = "0.1.0"
description = "A modeling-aware data quality diagnostic agent"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "missingno",
    "matplotlib",
    "streamlit",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]