[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-doctor"
version = "0.2.0"
description = "A modeling-aware data quality diagnostic agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shenghuoxuejia" }]
keywords = ["data-quality", "data-leakage", "langgraph", "llm", "tabular-ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn>=1.3",
    "streamlit",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
bench = ["matplotlib", "missingno", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
